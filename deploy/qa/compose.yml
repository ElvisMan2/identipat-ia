name: identipat-qa-app

services:
  app:
    image: ${IDENTIPAT_IMAGE:?Set IDENTIPAT_IMAGE to an immutable GHCR digest}
    pull_policy: always
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
      SERVER_PORT: 8082
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      IDENTIPAT_AI_ENABLED: ${IDENTIPAT_AI_ENABLED}
      IDENTIPAT_AI_PROVIDER: ${IDENTIPAT_AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-60s}
      PREPROCESSING_SERVICE_BASE_URL: http://preprocessing:8090
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STANDARD_SESSION_PEPPER: ${STANDARD_SESSION_PEPPER}
      STANDARD_SESSION_INACTIVITY_TIMEOUT: ${STANDARD_SESSION_INACTIVITY_TIMEOUT:-30m}
      STANDARD_SESSION_ABSOLUTE_TIMEOUT: ${STANDARD_SESSION_ABSOLUTE_TIMEOUT:-8h}
      ANALYSIS_WORKER_THREADS: ${ANALYSIS_WORKER_THREADS:-1}
      ANALYSIS_WORKER_QUEUE_CAPACITY: ${ANALYSIS_WORKER_QUEUE_CAPACITY:-1}
      ANALYSIS_WORKER_ENABLED: "true"
      ANALYSIS_ADMISSION_ENABLED: ${ANALYSIS_ADMISSION_ENABLED:-true}
      ANALYSIS_STANDARD_MAX_PER_HOUR: ${ANALYSIS_STANDARD_MAX_PER_HOUR:-3}
      ANALYSIS_STANDARD_MAX_PER_24H: ${ANALYSIS_STANDARD_MAX_PER_24H:-10}
      ANALYSIS_STANDARD_AUDIO_MAX_PER_24H: ${ANALYSIS_STANDARD_AUDIO_MAX_PER_24H:-3}
      ANALYSIS_STANDARD_MAX_ACTIVE: ${ANALYSIS_STANDARD_MAX_ACTIVE:-1}
      ANALYSIS_GLOBAL_MAX_ACTIVE: ${ANALYSIS_GLOBAL_MAX_ACTIVE:-8}
      ANALYSIS_AUDIO_MAX_PREPROCESSING: ${ANALYSIS_AUDIO_MAX_PREPROCESSING:-1}
      ANALYSIS_ADMISSION_RESERVATION_TTL: ${ANALYSIS_ADMISSION_RESERVATION_TTL:-8m}
      ANALYSIS_ADMISSION_RESERVATION_SAFETY_MARGIN: ${ANALYSIS_ADMISSION_RESERVATION_SAFETY_MARGIN:-60s}
      ANALYSIS_ADMISSION_RETRY_AFTER: ${ANALYSIS_ADMISSION_RETRY_AFTER:-10s}
      ANALYSIS_IDEMPOTENCY_REQUIRED: ${ANALYSIS_IDEMPOTENCY_REQUIRED:-false}
      ANALYSIS_IDEMPOTENCY_MAX_KEY_LENGTH: ${ANALYSIS_IDEMPOTENCY_MAX_KEY_LENGTH:-64}
      ANALYSIS_IDEMPOTENCY_CLAIM_TTL: ${ANALYSIS_IDEMPOTENCY_CLAIM_TTL:-10m}
      ANALYSIS_IDEMPOTENCY_RETENTION: ${ANALYSIS_IDEMPOTENCY_RETENTION:-48h}
      ANALYSIS_IDEMPOTENCY_IN_PROGRESS_RETRY_AFTER: ${ANALYSIS_IDEMPOTENCY_IN_PROGRESS_RETRY_AFTER:-5s}
      ANALYSIS_IDEMPOTENCY_HMAC_SECRET: ${ANALYSIS_IDEMPOTENCY_HMAC_SECRET:?Set a stable random idempotency HMAC secret}
      PREPROCESSING_SERVICE_CONNECT_TIMEOUT: ${PREPROCESSING_SERVICE_CONNECT_TIMEOUT:-5s}
      PREPROCESSING_PDF_TIMEOUT: ${PREPROCESSING_PDF_TIMEOUT:-15s}
      PREPROCESSING_AUDIO_TIMEOUT: ${PREPROCESSING_AUDIO_TIMEOUT:-300s}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8082}:8082"
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    cpus: ${APP_CPU_LIMIT:-0.75}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8082/identipat-ia/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - internal
    depends_on:
      preprocessing:
        condition: service_healthy

  preprocessing:
    image: ${PREPROCESSING_IMAGE:?Set PREPROCESSING_IMAGE to an immutable GHCR digest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PREPROCESSING_ENV: prod
      PREPROCESSING_HOST: 0.0.0.0
      PREPROCESSING_PORT: 8090
      PREPROCESSING_LOG_LEVEL: ${PREPROCESSING_LOG_LEVEL:-INFO}
      PREPROCESSING_PDF_MAX_FILE_SIZE_BYTES: ${PREPROCESSING_PDF_MAX_FILE_SIZE_BYTES:-10485760}
      PREPROCESSING_PDF_MAX_PAGES: ${PREPROCESSING_PDF_MAX_PAGES:-50}
      PREPROCESSING_AUDIO_MAX_FILE_SIZE_BYTES: ${PREPROCESSING_AUDIO_MAX_FILE_SIZE_BYTES:-20971520}
      PREPROCESSING_AUDIO_MAX_DURATION_SECONDS: ${PREPROCESSING_AUDIO_MAX_DURATION_SECONDS:-180}
      PREPROCESSING_AUDIO_MODEL: ${PREPROCESSING_AUDIO_MODEL:-base}
      PREPROCESSING_AUDIO_LANGUAGE: ${PREPROCESSING_AUDIO_LANGUAGE:-es}
      PREPROCESSING_AUDIO_DEVICE: ${PREPROCESSING_AUDIO_DEVICE:-cpu}
      PREPROCESSING_AUDIO_COMPUTE_TYPE: ${PREPROCESSING_AUDIO_COMPUTE_TYPE:-int8}
      PREPROCESSING_AUDIO_MODEL_CACHE_DIR: /models
      HF_HOME: /models/.huggingface
      HF_HUB_DISABLE_XET: "1"
    expose:
      - "8090"
    volumes:
      - preprocessing_models:/models
    mem_limit: ${PREPROCESSING_MEMORY_LIMIT:-640m}
    cpus: ${PREPROCESSING_CPU_LIMIT:-0.50}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3));
          assert data.get('status') == 'UP' and data.get('service') == 'preprocessing-service'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - internal

volumes:
  preprocessing_models:
    name: identipat-qa_preprocessing_models

networks:
  internal:
    external: true
    name: identipat-qa_internal
