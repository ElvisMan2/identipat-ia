let reportResponse;

const INPUT_LABELS = {
  TEXT: 'Texto',
  PDF: 'PDF',
  AUDIO: 'Audio'
};

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function fmtDate(value) {
  if (!value) return '';
  return new Intl.DateTimeFormat('es-PE', {
    dateStyle: 'medium',
    timeStyle: 'short',
    timeZone: 'America/Lima'
  }).format(new Date(value));
}

function relationClass(applicability) {
  if (applicability === 'POSSIBLE') return 'possible';
  if (applicability === 'UNLIKELY') return 'unlikely';
  return '';
}

function screeningHtml(screening) {
  if (!screening) return '';
  const article = a => a ? `
    <div class="screening-article">
      <strong>${escapeHtml(a.article || `Artículo ${a === screening.article15 ? '15' : '20'}`)} · ${escapeHtml(a.assessmentLabel || a.assessment)}</strong>
      <p>${escapeHtml(a.rationale)}</p>
      ${a.matches?.length ? `<ul>${a.matches.map(m => `<li><strong>${escapeHtml(m.literal)}</strong>: ${escapeHtml(m.rationale)}</li>`).join('')}</ul>` : ''}
    </div>` : '';

  return `
    <div class="screening-box">
      <h4>${escapeHtml(screening.title || 'Revisión de posibles exclusiones de patentabilidad')}</h4>
      ${screening.context ? `<p>${escapeHtml(screening.context)}</p>` : ''}
      <div class="screening-detail">
        ${article(screening.article15)}
        ${article(screening.article20)}
      </div>
      ${screening.scopeNote ? `<p class="scope-note">${escapeHtml(screening.scopeNote)}</p>` : ''}
    </div>`;
}

function geneticHtml(genetic, embedded = false) {
  if (!genetic) return '';
  return `
    <div class="${embedded ? 'screening-box' : ''}">
      <h4>${escapeHtml(genetic.assessmentLabel || genetic.assessment)}</h4>
      <p>${escapeHtml(genetic.rationale)}</p>
      ${genetic.missingInformation?.length ? `
        <p>Información faltante</p>
        <ul>${genetic.missingInformation.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>` : ''}
    </div>`;
}

function modalityCard(reportModality, guidanceModality, index) {
  const geneticResourceAccess = reportModality.geneticResourceAccess ||
    (index === 0 ? reportResponse.geneticResourceAccess : null);
  const modalityNames = {
    INVENTION_PATENT: 'Patente de invención',
    UTILITY_MODEL: 'Modelo de utilidad',
    INDUSTRIAL_DESIGN: 'Diseño industrial',
    COPYRIGHT: 'Derecho de autor',
    DISTINCTIVE_SIGN: 'Signo distintivo',
    PLANT_BREEDER_CERTIFICATE: 'Certificado de obtentor',
    TRADE_SECRET: 'Secreto empresarial'
  };
  const applicabilityLabels = {
    LIKELY: 'Se relaciona claramente',
    POSSIBLE: 'Podría corresponder',
    UNLIKELY: 'No parece aplicable'
  };

  return `
    <article>
      <button type="button" data-card-trigger aria-expanded="${index === 0 ? 'true' : 'false'}" onclick="toggleCard(this)">
        <div class="card-left">
          <div class="card-info">
            <div class="card-header-title-row">
              <h3>${escapeHtml(reportModality.name || modalityNames[reportModality.type] || reportModality.type)}</h3>
            </div>
            ${guidanceModality?.shortDescription ? `<p class="short-description">${escapeHtml(guidanceModality.shortDescription)}</p>` : ''}
          </div>
        </div>
        <div class="card-right">
          <span class="badge-relation ${relationClass(reportModality.applicability)}">
            <span class="badge-relation-dot"></span>
            ${escapeHtml(reportModality.applicabilityLabel || applicabilityLabels[reportModality.applicability] || reportModality.applicability)}
          </span>
        </div>
      </button>

      <div data-card-content ${index === 0 ? '' : 'hidden'}>
        <div class="diagnosis-panel">
          <div class="diag-item">
            <div class="diag-key">${escapeHtml(reportModality.relationshipQuestion || '¿Qué parte de tu creación podría proteger?')}</div>
            <div class="diag-val"><p>${escapeHtml(reportModality.protectedSubjectMatter)}</p></div>
          </div>

          <div class="diag-item">
            <div class="diag-key">¿Por qué se identificó?</div>
            <div class="diag-val"><p>${escapeHtml(reportModality.rationale)}</p></div>
          </div>

          ${reportModality.legalBasis?.length ? `
          <div class="diag-item">
            <div class="diag-key">Base legal</div>
            <div class="diag-val">
              <ul>${reportModality.legalBasis.map(basis => `<li>${escapeHtml(basis.instrument)}: ${basis.articles.map(article => escapeHtml(article)).join(', ')}</li>`).join('')}</ul>
            </div>
          </div>` : ''}

          ${reportModality.orientation ? `
          <div class="diag-item">
            <div class="diag-key">Orientación diagnóstica</div>
            <div class="diag-val"><p>${escapeHtml(reportModality.orientation)}</p></div>
          </div>` : ''}

          ${geneticResourceAccess ? `
          <div class="diag-item full-width">
            <div class="diag-key">Recursos genéticos</div>
            <div class="diag-val">${geneticHtml(geneticResourceAccess, true)}</div>
          </div>` : ''}
        </div>
      </div>
    </article>`;
}

function renderComplementary() {
  const cards = [];

  if (reportResponse.patentScreening) {
    cards.push(`
      <article class="context-card full">
        <h3>${escapeHtml(reportResponse.patentScreening.title || 'Revisión de patentabilidad')}</h3>
        ${screeningHtml(reportResponse.patentScreening)}
      </article>`);
  }

  if (reportResponse.historicalPatentability) {
    cards.push(`
      <article class="context-card full">
        <h3>Antecedente histórico de patentabilidad</h3>
        <p><strong>${escapeHtml(reportResponse.historicalPatentability.outcome)}</strong></p>
        <p>${escapeHtml(reportResponse.historicalPatentability.rationale)}</p>
      </article>`);
  }

  if (cards.length) {
    document.getElementById('complementary-section').hidden = false;
    document.getElementById('complementary-grid').innerHTML = cards.join('');
  }
}

function renderListSection(sectionId, listId, values) {
  if (!values?.length) return;
  document.getElementById(sectionId).hidden = false;
  document.getElementById(listId).innerHTML = values.map(x => `<li>${escapeHtml(x)}</li>`).join('');
}

function render() {
  document.getElementById('report-title').textContent = reportResponse.title || 'Reporte de diagnóstico de propiedad intelectual';
  document.getElementById('completed-at').textContent = fmtDate(reportResponse.analysisCompletedAt);
  document.getElementById('modalities-count').textContent = String(reportResponse.protectionOptions.length);
  document.getElementById('report-summary').textContent = reportResponse.summary;

  const guidanceByType = new Map(guidanceResponse.modalities.map(x => [x.protectionType, x]));
  document.getElementById('modalities-grid').innerHTML =
    reportResponse.protectionOptions
      .map((x, i) => modalityCard(x, guidanceByType.get(x.type), i))
      .join('');

  renderComplementary();
  renderListSection('observations-section', 'observations-list', reportResponse.observations);
  renderListSection('warnings-section', 'warnings-list', reportResponse.warnings);

  const disclaimer = reportResponse.disclaimer;
  document.getElementById('disclaimer-title').textContent = disclaimer?.title || 'Importante';
  document.getElementById('disclaimer-content').textContent = disclaimer?.content || reportResponse.warnings?.[0] || '';
  document.getElementById('disclaimer-version').textContent = disclaimer?.version ? `Versión institucional ${disclaimer.version}` : '';
}

function toggleCard(btn) {
  const card = btn.closest('article');
  const isExpanded = btn.getAttribute('aria-expanded') === 'true';
  document.querySelectorAll('[data-card-trigger]').forEach(trigger => {
    const item = trigger.closest('article');
    const content = item.querySelector('[data-card-content]');
    const shouldOpen = item === card && !isExpanded;
    trigger.setAttribute('aria-expanded', String(shouldOpen));
    content.hidden = !shouldOpen;
  });
}

    return response.json();
  })
  .then(data => {
    reportResponse = data;
    render();
  })
  .catch(error => {
    console.error(error);
    document.getElementById('modalities-grid').textContent = 'No se pudieron cargar los datos del reporte.';
  });
</script>
</body>
