server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /identipat-ia

spring:
  application:
    name: identipat-ia
  servlet:
    multipart:
      max-file-size: ${ANALYSIS_AUDIO_MAX_FILE_SIZE_BYTES:20971520}
      max-request-size: ${ANALYSIS_MULTIPART_MAX_REQUEST_SIZE:21MB}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5433/${DB_NAME:identipatdb}}
    username: ${DB_USER:identipat_dev_user}
    password: ${DB_PASSWORD:dev_password_123}
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIME_ZONE:America/Lima}
  jackson:
    date-format: dd/MM/yyyy HH:mm:ss
    time-zone: ${APP_TIME_ZONE:America/Lima}
  web:
    resources:
      static-locations: classpath:/static/

app:
  analysis:
    text-min-length: ${ANALYSIS_TEXT_MIN_LENGTH:20}
    text-max-length: ${ANALYSIS_TEXT_MAX_LENGTH:20000}
    worker-enabled: ${ANALYSIS_WORKER_ENABLED:true}
    poll-interval: ${ANALYSIS_POLL_INTERVAL:2s}
    worker-threads: ${ANALYSIS_WORKER_THREADS:2}
    worker-queue-capacity: ${ANALYSIS_WORKER_QUEUE_CAPACITY:2}
    lease-duration: ${ANALYSIS_LEASE_DURATION:120s}
    max-attempts: ${ANALYSIS_MAX_ATTEMPTS:2}
    retry-delay: ${ANALYSIS_RETRY_DELAY:5s}
    ai-max-output-tokens: ${ANALYSIS_AI_MAX_OUTPUT_TOKENS:6000}
    pdf:
      max-file-size-bytes: ${ANALYSIS_PDF_MAX_FILE_SIZE_BYTES:10485760}
      max-pages: ${ANALYSIS_PDF_MAX_PAGES:50}
    audio:
      max-file-size-bytes: ${ANALYSIS_AUDIO_MAX_FILE_SIZE_BYTES:20971520}
      max-duration-seconds: ${ANALYSIS_AUDIO_MAX_DURATION_SECONDS:180}
    admission:
      enabled: ${ANALYSIS_ADMISSION_ENABLED:true}
      standard-max-per-hour: ${ANALYSIS_STANDARD_MAX_PER_HOUR:3}
      standard-max-per-24-hours: ${ANALYSIS_STANDARD_MAX_PER_24H:10}
      standard-audio-max-per-24-hours: ${ANALYSIS_STANDARD_AUDIO_MAX_PER_24H:3}
      standard-max-active: ${ANALYSIS_STANDARD_MAX_ACTIVE:1}
      global-max-active: ${ANALYSIS_GLOBAL_MAX_ACTIVE:8}
      audio-max-preprocessing: ${ANALYSIS_AUDIO_MAX_PREPROCESSING:1}
      reservation-ttl: ${ANALYSIS_ADMISSION_RESERVATION_TTL:8m}
      reservation-safety-margin: ${ANALYSIS_ADMISSION_RESERVATION_SAFETY_MARGIN:60s}
      retry-after: ${ANALYSIS_ADMISSION_RETRY_AFTER:10s}
    idempotency:
      required: ${ANALYSIS_IDEMPOTENCY_REQUIRED:false}
      max-key-length: ${ANALYSIS_IDEMPOTENCY_MAX_KEY_LENGTH:64}
      claim-ttl: ${ANALYSIS_IDEMPOTENCY_CLAIM_TTL:10m}
      retention: ${ANALYSIS_IDEMPOTENCY_RETENTION:48h}
      in-progress-retry-after: ${ANALYSIS_IDEMPOTENCY_IN_PROGRESS_RETRY_AFTER:5s}
      hmac-secret: ${ANALYSIS_IDEMPOTENCY_HMAC_SECRET:identipat-idempotency-dev-secret-change-me}
  preprocessing:
    base-url: ${PREPROCESSING_SERVICE_BASE_URL:http://localhost:8090}
    connect-timeout: ${PREPROCESSING_SERVICE_CONNECT_TIMEOUT:5s}
    pdf-timeout: ${PREPROCESSING_PDF_TIMEOUT:15s}
    audio-timeout: ${PREPROCESSING_AUDIO_TIMEOUT:300s}
  jwt:
    secret: ${JWT_SECRET:identipat-dev-secret-key-change-me-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  standard-session:
    cookie-name: IDENTIPAT_STANDARD_SESSION

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
