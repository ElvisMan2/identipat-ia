server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /identipat-ia

spring:
  application:
    name: identipat-ia
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5433/${DB_NAME:identipatdb}}
    username: ${DB_USER:identipat_dev_user}
    password: ${DB_PASSWORD:dev_password_123}
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: ${APP_TIME_ZONE:America/Lima}
  jackson:
    date-format: dd/MM/yyyy HH:mm:ss
    time-zone: ${APP_TIME_ZONE:America/Lima}
  web:
    resources:
      static-locations: '${STATIC_LOCATIONS:file:../frontend/dist/identipat-ia/browser/}'

app:
  analysis:
    text-min-length: ${ANALYSIS_TEXT_MIN_LENGTH:20}
    text-max-length: ${ANALYSIS_TEXT_MAX_LENGTH:20000}
    worker-enabled: ${ANALYSIS_WORKER_ENABLED:true}
    poll-interval: ${ANALYSIS_POLL_INTERVAL:2s}
    worker-threads: ${ANALYSIS_WORKER_THREADS:2}
    worker-queue-capacity: ${ANALYSIS_WORKER_QUEUE_CAPACITY:2}
    lease-duration: ${ANALYSIS_LEASE_DURATION:120s}
    max-attempts: ${ANALYSIS_MAX_ATTEMPTS:2}
    retry-delay: ${ANALYSIS_RETRY_DELAY:5s}
    ai-max-output-tokens: ${ANALYSIS_AI_MAX_OUTPUT_TOKENS:4000}
  preprocessing:
    base-url: ${PREPROCESSING_SERVICE_BASE_URL:http://localhost:8090}
    timeout: 5s
  jwt:
    secret: ${JWT_SECRET:identipat-dev-secret-key-change-me-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  standard-session:
    cookie-name: IDENTIPAT_STANDARD_SESSION

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
