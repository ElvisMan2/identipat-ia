server:
  port: ${SERVER_PORT:0}

spring:
  web:
    resources:
      static-locations: '${STATIC_LOCATIONS:file:../frontend/dist/identipat-ia/browser/}'
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate

app:
  preprocessing:
    base-url: http://preprocessing-service.test
    timeout: 5s
  jwt:
    secret: identipat-test-secret-key-only-for-automated-tests
  cors:
    allowed-origins: http://localhost:4200

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
