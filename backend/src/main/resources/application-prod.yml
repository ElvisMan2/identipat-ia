server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
  web:
    resources:
      static-locations: '${STATIC_LOCATIONS:file:../frontend/dist/identipat-ia/browser/}'

app:
  ai:
    enabled: ${IDENTIPAT_AI_ENABLED}
    provider: ${IDENTIPAT_AI_PROVIDER}
    openai:
      api-key: ${OPENAI_API_KEY}
      model: ${OPENAI_MODEL}
      timeout: ${OPENAI_TIMEOUT}
  preprocessing:
    base-url: ${PREPROCESSING_SERVICE_BASE_URL}
    timeout: 5s
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  standard-session:
    pepper: ${STANDARD_SESSION_PEPPER}
    inactivity-timeout: ${STANDARD_SESSION_INACTIVITY_TIMEOUT:30m}
    absolute-timeout: ${STANDARD_SESSION_ABSOLUTE_TIMEOUT:8h}
    cookie-secure: true
    consent-current-version: ${CONSENT_CURRENT_VERSION}
    consent-document-sha256: ${CONSENT_DOCUMENT_SHA256}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
