server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
  web:
    resources:
      static-locations: '${STATIC_LOCATIONS:file:./frontend/dist/identipat-ia/browser/}'

app:
  preprocessing:
    base-url: ${PREPROCESSING_SERVICE_BASE_URL}
    timeout: 5s
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
