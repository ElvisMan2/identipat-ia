name: Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - main
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw clean test

      - name: Package backend
        working-directory: backend
        run: ./mvnw clean package -DskipTests

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoGpu

      - name: Build static frontend
        working-directory: frontend
        run: npm run build:prod

      - name: Verify static build layout
        shell: bash
        run: |
          test -f frontend/dist/identipat-ia/browser/index.html
          test ! -d frontend/dist/identipat-ia/server

  preprocessing:
    name: Preprocessing CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: preprocessing-service/pyproject.toml

      - name: Install preprocessing service and development dependencies
        working-directory: preprocessing-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run preprocessing tests
        working-directory: preprocessing-service
        run: python -m pytest

      - name: Run Ruff
        working-directory: preprocessing-service
        run: python -m ruff check .

      - name: Build preprocessing Docker image
        working-directory: preprocessing-service
        run: docker build -t identipat-preprocessing:ci .

      - name: Verify preprocessing container health
        working-directory: preprocessing-service
        shell: bash
        run: |
          set -euo pipefail
          container_name="identipat-preprocessing-ci"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" --publish 127.0.0.1::8090 identipat-preprocessing:ci
          health_url="http://$(docker port "$container_name" 8090/tcp)"
          response=""
          for attempt in {1..10}; do
            if response="$(curl --fail --silent --show-error "$health_url/health")"; then
              break
            fi
            sleep 1
          done
          test "$response" = '{"status":"UP","service":"preprocessing-service","version":"0.1.0"}'

  integrated-image:
    name: Integrated image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - frontend
      - preprocessing
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build integrated image
        run: docker build --tag "identipat-integrated:${GITHUB_SHA}" .

      - name: Smoke test integrated image
        run: bash scripts/smoke-integrated-image.sh "identipat-integrated:${GITHUB_SHA}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable SHA image
        if: github.event_name == 'push'
        id: publish
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}"
          docker tag "identipat-integrated:${GITHUB_SHA}" "${repository}:${tag}"
          docker push "${repository}:${tag}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${repository}:${tag}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "### Integrated image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
