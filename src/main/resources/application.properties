# Nombre de la aplicación
spring.application.name=identipat-ia

# Puerto del servidor
server.port=8082

# Context path (ajusta si quieres exponer la app bajo un prefijo)
server.servlet.context-path=/identipat-ia

# Configuración de PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME:identipatdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:identipat_dev_user}
spring.datasource.password=${DB_PASSWORD:dev_password_123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Carpeta con los archivos estaticos del frontend (Angular) compilado: classpath para el jar empaquetado, file para ejecutar desde la raiz del repo
spring.web.resources.static-locations=classpath:/static/,file:frontend/dist/identipat-ia/browser/

# Formato de fecha y hora
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.time-zone=America/Lima

# Tambien puedes configurar la zona horaria del sistema Java (opcional, pero recomendable)
spring.application.time-zone=America/Lima

# Debe tener al menos 32 caracteres. En produccion usar una variable de entorno segura.
app.jwt.secret=${JWT_SECRET:identipat-dev-secret-key-change-me-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}