services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app-network

  preprocessing:
    build:
      context: ./preprocessing-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PREPROCESSING_ENV: ${PREPROCESSING_ENV:-dev}
      PREPROCESSING_HOST: ${PREPROCESSING_HOST:-0.0.0.0}
      PREPROCESSING_PORT: ${PREPROCESSING_PORT:-8090}
      PREPROCESSING_LOG_LEVEL: ${PREPROCESSING_LOG_LEVEL:-INFO}
      PREPROCESSING_PDF_MAX_FILE_SIZE_BYTES: ${PREPROCESSING_PDF_MAX_FILE_SIZE_BYTES:-10485760}
      PREPROCESSING_PDF_MAX_PAGES: ${PREPROCESSING_PDF_MAX_PAGES:-50}
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3));
          assert data.get('status') == 'UP' and data.get('service') == 'preprocessing-service'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
